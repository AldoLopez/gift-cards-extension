<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gift card settings</title>
  <link rel="stylesheet" href="../popup/popup.css">
  <style>
    main { max-width: 620px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { font-size: 28px; }
    .intro { color: var(--mute); margin-top: 6px; }
    section { margin-top: 32px; }
    h2 { font-size: 18px; }
    section > p { margin-top: 6px; color: var(--mute); max-width: 62ch; }
    .choice { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; background: var(--surface); border-radius: 10px; padding: 12px; margin-top: 8px; cursor: pointer; }
    .choice input { grid-row: span 2; margin-top: 3px; }
    .choice small { color: var(--mute); font-size: 13px; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 12px; }
    .status { margin-top: 10px; }
    .check { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
    .ok { color: var(--foil); margin-top: 8px; }
    input[type="password"] { max-width: 320px; }
    code { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module" src="options.js"></script>
</body>
</html>
